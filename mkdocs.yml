site_name: KiNESYS+ Documentation
site_description: Documentation for KiNESYS+ — Knowledge-Based Investigation of Energy System Scenarios
site_author: KanORS
site_url: https://kanors-emr.github.io/Kinesys-documentation/

repo_url: https://github.com/kanors-emr/Kinesys-documentation/issues
repo_name: Report a documentation issue
edit_uri: ""

copyright: "&copy; KanORS-EMR, 2026"

theme:
  name: material
  custom_dir: overrides
  logo: images/brand/kanors-logo-white.png
  favicon: images/brand/kanors-favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kanors-emr
      name: KanORS on GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/playlist?list=PLED97cPMXPOm60xOKSwvmXaGIsQrjoM8Y
      name: KanORS on YouTube
    - icon: fontawesome/solid/globe
      link: https://www.kanors-emr.org/
      name: KanORS website

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero-banner.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Permalink
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption:
      auto: false
  - pymdownx.details
  - pymdownx.escapeall
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md

  - Getting Started:
    - Introduction: pages/introduction.md
    - Institutional and Research Applications: pages/applications-and-impact.md
    - The Zen of GESM: pages/the-zen-of-gesm.md

  - Energy Supply:
    - Primary energy supply: pages/primary-energy-supply.md
    - Bioenergy resources: pages/bioenergy-resources.md
    - Liquid fuels processing: pages/liquid-fuels-processing.md
    - Hydrogen: pages/hydrogen.md
    - Energy trades: pages/energy-trades.md
    - Carbon capture and storage (CCS): pages/carbon-capture-and-storage-ccs.md

  - Power Sector:
    - Overview: pages/power-sector.md
    - Timeslice definitions: pages/timeslice-definitions.md
    - Electricity Load Shapes: pages/electricity-load-shapes.md
    - Renewable Energy Characterization: pages/renewable-energy-characterization.md

  - Demand Sectors:
    - Demand Projection: pages/demand-projection.md
    - Transport: pages/transport.md
    - Industry: pages/industry.md
    - Residential and commercial buildings: pages/residential-and-commercial-buildings.md
    - Agriculture: pages/agriculture.md

  - Reference:
    - Data Sources: pages/data-sources.md
    - GitHub Desktop Guide: pages/github-desktop-guide.md
